services:
  web:
    build: .
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pcalhaurin.rule=Host(`pcalhaurin.es`) || Host(`www.pcalhaurin.es`)"
      - "traefik.http.services.pcalhaurin.loadbalancer.server.port=80"
    networks:
      - proxy

networks:
  proxy:
    external: true
