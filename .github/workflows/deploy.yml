name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DOMAIN: pcalhaurin.es
  DEPLOY_PATH: /opt/pcalhaurin
  HUGO_VERSION: '0.165.0'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Hugo
        run: |
          wget -q "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar -xzf "hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          sudo mv hugo /usr/local/bin/

      - name: Build site
        working-directory: site
        run: hugo --minify

      - name: Deploy to server
        uses: easingthemes/ssh-deploy@v5
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
          REMOTE_HOST: ${{ secrets.SERVER_HOST }}
          REMOTE_USER: ${{ secrets.SERVER_USER }}
          SOURCE: "."
          TARGET: "${{ env.DEPLOY_PATH }}/"
          ARGS: "-avz --delete --exclude='.git'"

      - name: Rebuild and restart container
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_DEPLOY_KEY }}
          script: |
            cd ${{ env.DEPLOY_PATH }}
            docker compose up -d --build --force-recreate
            echo "--- Container status ---"
            docker compose ps
            echo "--- Health check ---"
            sleep 2
            curl -sf http://localhost:8080 > /dev/null && echo "OK: site responding" || echo "FAIL: site not responding"
