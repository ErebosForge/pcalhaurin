services:
  web:
    build: .
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      # Main HTTPS router
      - "traefik.http.routers.pcalhaurin.rule=Host(`pcalhaurin.es`)"
      - "traefik.http.routers.pcalhaurin.entrypoints=websecure"
      - "traefik.http.routers.pcalhaurin.tls.certresolver=letsencrypt"
      - "traefik.http.routers.pcalhaurin.middlewares=security-headers@file"
      - "traefik.http.services.pcalhaurin.loadbalancer.server.port=80"
      # www → non-www redirect (HTTPS)
      - "traefik.http.routers.pcalhaurin-www.rule=Host(`www.pcalhaurin.es`)"
      - "traefik.http.routers.pcalhaurin-www.entrypoints=websecure"
      - "traefik.http.routers.pcalhaurin-www.tls.certresolver=letsencrypt"
      - "traefik.http.routers.pcalhaurin-www.middlewares=www-to-nonwww-pcalhaurin@file"
    networks:
      - proxy

networks:
  proxy:
    external: true
