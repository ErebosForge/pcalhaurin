name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEPLOY_PATH: /data/deployments/pcalhaurin

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Deploy
        uses: appleboy/ssh-action@v1
        env:
          # The built-in token can read this repository during the workflow.
          GH_TOKEN: ${{ github.token }}
          GIT_REF: ${{ github.sha }}
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_DEPLOY_KEY }}
          envs: GH_TOKEN,GIT_REF
          script: |
            set -euo pipefail
            BASE="/data/deployments/pcalhaurin"
            RELEASE="$BASE/releases/$(date +%Y%m%d_%H%M%S)"
            CURRENT="$BASE/current"

            echo "=== Deploying pcalhaurin ==="

            # Common infrastructure owns the proxy network; application deploys only require it.
            if ! podman network exists proxy; then
              echo "ERROR: common-infrastructure has not created the proxy network"
              exit 1
            fi

            if [ -z "${GH_TOKEN:-}" ]; then
              echo "ERROR: GitHub clone token was not provided to the remote deploy script"
              exit 1
            fi

            # Clone fresh release at the exact commit
            mkdir -p "$BASE/releases"
            git clone --quiet "https://x-access-token:${GH_TOKEN}@github.com/ErebosForge/pcalhaurin.git" "$RELEASE"
            cd "$RELEASE"
            git checkout --quiet "$GIT_REF"
            echo "Cloned at $(git rev-parse --short HEAD)"

            # Build BEFORE stopping old (minimise downtime)
            COMPOSE_PROJECT_NAME=prod-pcalhaurin podman-compose build --no-cache

            # Stop old if symlink exists
            if [ -L "$CURRENT" ]; then
              OLD_RELEASE=$(readlink -f "$CURRENT")
              if [ -f "$OLD_RELEASE/docker-compose.yml" ]; then
                cd "$OLD_RELEASE"
                COMPOSE_PROJECT_NAME=prod-pcalhaurin podman-compose down 2>&1 || true
              fi
            fi

            # Remove any stale PCAlhaurin containers left by older release projects.
            # The service label is unique to this application and prevents duplicate Traefik routers.
            for CONTAINER in $(podman ps -a --format '{{.Names}}'); do
              LABELS=$(podman inspect --format '{{json .Config.Labels}}' "$CONTAINER" 2>/dev/null || true)
              if printf '%s' "$LABELS" | grep -Fq '"traefik.http.services.pcalhaurin.loadbalancer.server.port":"80"'; then
                echo "Removing previous PCAlhaurin container: $CONTAINER"
                podman rm -f "$CONTAINER" >/dev/null
              fi
            done

            # Swap symlink and start new
            ln -sfn "$RELEASE" "$CURRENT"
            cd "$RELEASE"
            COMPOSE_PROJECT_NAME=prod-pcalhaurin podman-compose up -d

            # === Boot persistence: rootless systemd --user unit ===
            # Ensures containers come back after an OCI reboot (unless-stopped is
            # NOT enough for rootless Podman without a user service + linger).
            mkdir -p "$HOME/.config/systemd/user"
            install -m 0644 "$RELEASE/deploy/prod-pcalhaurin.service" \
              "$HOME/.config/systemd/user/prod-pcalhaurin.service"
            if command -v loginctl >/dev/null 2>&1; then
              [ "$(loginctl show-user "$(id -un)" -p Linger --value 2>/dev/null || echo no)" = yes ] \
                || sudo -n loginctl enable-linger "$(id -un)" || true
            fi
            systemctl --user enable --now podman.socket >/dev/null 2>&1 || true
            systemctl --user daemon-reload
            systemctl --user enable prod-pcalhaurin.service >/dev/null 2>&1 || true

            # === Health checks ===
            echo ""
            echo "=== Health checks ==="
            FAILED=0

            # Check pcalhaurin.es (retry up to 5 times)
            for i in 1 2 3 4 5; do
              CODE=$(curl -k -sS -o /dev/null -w '%{http_code}' --resolve "pcalhaurin.es:443:127.0.0.1" "https://pcalhaurin.es/" 2>/dev/null || echo "000")
              if [ "$CODE" = "200" ]; then
                echo "✅ pcalhaurin.es → $CODE"
                break
              fi
              echo "⏳ pcalhaurin.es → $CODE (attempt $i/5)"
              sleep 3
            done
            if [ "$CODE" != "200" ]; then
              echo "❌ pcalhaurin.es FAILED (last code: $CODE)"
              FAILED=1
            fi

            echo ""
            if [ "$FAILED" -ne 0 ]; then
              echo "❌ DEPLOY FAILED — health checks did not pass"
              exit 1
            fi
            echo "✅ Deploy successful"

            # Cleanup old releases (keep last 3)
            ls -dt $BASE/releases/*/ 2>/dev/null | tail -n +4 | xargs rm -rf 2>/dev/null || true
