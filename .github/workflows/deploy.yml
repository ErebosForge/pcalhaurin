name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEPLOY_PATH: /data/deployments/pcalhaurin

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Deploy
        uses: appleboy/ssh-action@v1
        env:
          GH_TOKEN: ${{ secrets.CICD_ACCESS_TOKEN }}
          GIT_REF: ${{ github.sha }}
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_DEPLOY_KEY }}
          envs: GH_TOKEN,GIT_REF
          script: |
            set -e
            BASE="${{ env.DEPLOY_PATH }}"
            RELEASE="$BASE/releases/$(date +%Y%m%d_%H%M%S)"
            CURRENT="$BASE/current"

            # Clone fresh release at the exact commit
            mkdir -p "$BASE/releases"
            git clone https://x-access-token:${GH_TOKEN}@github.com/ErebosForge/pcalhaurin.git "$RELEASE"
            cd "$RELEASE"
            git checkout "$GIT_REF"

            # Build Hugo site
            hugo --minify --source site

            # Stop old if symlink exists
            if [ -L "$CURRENT" ]; then
              OLD_RELEASE=$(readlink -f "$CURRENT")
              cd "$OLD_RELEASE"
              docker compose down || true
            fi

            # Swap symlink
            ln -sfn "$RELEASE" "$CURRENT"

            # Start new
            cd "$RELEASE"
            docker compose up -d --build

            # Health check
            sleep 2
            curl -sf http://localhost:8080 > /dev/null && echo "OK: site responding" || echo "FAIL: site not responding"

            # Cleanup old releases (keep last 3)
            ls -dt $BASE/releases/*/ 2>/dev/null | tail -n +4 | xargs rm -rf 2>/dev/null || true
