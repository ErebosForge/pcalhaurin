<!DOCTYPE html>
<html lang="{{ .Language.Lang }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ .Title }}</title>
  <meta name="description" content="{{ .Description }}">
  <meta name="robots" content="index, follow">
  <meta name="author" content="PCAlhaurín">
  <meta name="geo.region" content="ES-MA">
  <meta name="geo.placename" content="Alhaurín de la Torre">
  <meta name="theme-color" content="#1E293B">
  <link rel="canonical" href="{{ .Permalink }}">
  {{ range .Translations }}
  <link rel="alternate" hreflang="{{ .Language.Lang }}" href="{{ .Permalink }}">
  {{ end }}
  <link rel="alternate" hreflang="{{ .Language.Lang }}" href="{{ .Permalink }}">
  <!-- Open Graph -->
  <meta property="og:title" content="{{ .Title }}">
  <meta property="og:description" content="{{ .Description }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ .Permalink }}">
  <meta property="og:locale" content="{{ if eq .Language.Lang "es" }}es_ES{{ else }}en_GB{{ end }}">
  <meta property="og:image" content="{{ "img/01-cpu-amd.jpg" | absURL }}">
  <meta property="og:image:width" content="800">
  <meta property="og:image:height" content="600">
  <meta property="og:site_name" content="PCAlhaurín">
  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ .Title }}">
  <meta name="twitter:description" content="{{ .Description }}">
  <meta name="twitter:image" content="{{ "img/01-cpu-amd.jpg" | absURL }}">
  <!-- Font: Inter (400, 600, 700) — preloaded for faster render -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"></noscript>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="describedby" href="/llms.txt">
</head>
<body>
  <!-- Skip to content (a11y) -->
  <a href="#main-content" class="skip-link">{{ if eq .Language.Lang "es" }}Saltar al contenido{{ else }}Skip to content{{ end }}</a>

  {{ block "main" . }}{{ end }}

  <!-- Sticky footer with contact info -->
  <footer class="footer-sticky" role="contentinfo">
    <div class="container footer-inner">
      <span class="footer-contact">
        <a href="https://wa.me/{{ site.Params.whatsapp }}?text={{ if eq .Language.Lang "es" }}Hola,%20necesito%20presupuesto{{ else }}Hi,%20I%20need%20a%20quote{{ end }}" target="_blank" rel="noopener">💬 WhatsApp</a>
        · {{ site.Params.phone }}
      </span>
      <span class="footer-copy">
        © {{ now.Year }} PCAlhaurín ·
        <a href="{{ "legal" | relLangURL }}/" class="footer-legal">{{ if eq .Language.Lang "es" }}Aviso legal{{ else }}Legal{{ end }}</a>
      </span>
    </div>
  </footer>

  <!-- WhatsApp floating button -->
  <a href="https://wa.me/{{ site.Params.whatsapp }}?text={{ if eq .Language.Lang "es" }}Hola,%20necesito%20ayuda%20con%20mi%20ordenador{{ else }}Hi,%20I%20need%20help%20with%20my%20computer{{ end }}" 
     class="wa-float" 
     target="_blank" 
     rel="noopener" 
     aria-label="{{ if eq .Language.Lang "es" }}Contactar por WhatsApp{{ else }}Contact via WhatsApp{{ end }}">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
    </svg>
  </a>

  <!-- Scroll fade-in (no dependencies, respects prefers-reduced-motion) -->
  <script>
    if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      document.querySelectorAll('.section:not(.hero)').forEach(function(el) {
        el.classList.add('fade-in');
      });
      var observer = new IntersectionObserver(function(entries) {
        entries.forEach(function(entry) {
          if (entry.isIntersecting) {
            entry.target.classList.add('visible');
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.1 });
      document.querySelectorAll('.fade-in').forEach(function(el) {
        observer.observe(el);
      });
    }
  </script>
</body>
</html>
