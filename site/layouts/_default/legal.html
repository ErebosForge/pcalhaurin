{{ define "main" }}
<nav class="nav" aria-label="{{ if eq .Language.Lang "es" }}Navegación principal{{ else }}Main navigation{{ end }}">
  <div class="container">
    <a href="{{ .Site.Home.RelPermalink }}" class="nav-brand"><span class="brand-pc">PC</span><span class="brand-alhaurin">Alhaurin</span><span class="brand-tld">.es</span></a>
    <div class="nav-right">
      <span class="lang-switch" aria-label="{{ if eq .Language.Lang "es" }}Cambiar idioma{{ else }}Change language{{ end }}">
        {{ range .Translations }}
        <a href="{{ .Permalink }}" hreflang="{{ .Language.Lang }}">{{ .Language.Label }}</a>
        {{ end }}
      </span>
    </div>
  </div>
</nav>

<main id="main-content">
  <section class="section legal-content">
    <div class="container">
      {{ .Content }}
    </div>
  </section>
</main>
{{ end }}
