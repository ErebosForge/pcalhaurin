name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEPLOY_PATH: /data/deployments/pcalhaurin

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Deploy
        uses: appleboy/ssh-action@v1
        env:
          GH_TOKEN: ${{ secrets.CICD_ACCESS_TOKEN }}
          GIT_REF: ${{ github.sha }}
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_DEPLOY_KEY }}
          envs: GH_TOKEN,GIT_REF
          script: |
            set -euo pipefail
            BASE="/data/deployments/pcalhaurin"
            RELEASE="$BASE/releases/$(date +%Y%m%d_%H%M%S)"
            CURRENT="$BASE/current"

            echo "=== Deploying pcalhaurin ==="

            # Common infrastructure owns the proxy network; application deploys only require it.
            if ! podman network exists proxy; then
              echo "ERROR: common-infrastructure has not created the proxy network"
              exit 1
            fi

            # Clone fresh release at the exact commit
            mkdir -p "$BASE/releases"
            git clone --quiet https://x-access-token:${GH_TOKEN}@github.com/ErebosForge/pcalhaurin.git "$RELEASE"
            cd "$RELEASE"
            git checkout --quiet "$GIT_REF"
            echo "Cloned at $(git rev-parse --short HEAD)"

            # Build BEFORE stopping old (minimise downtime)
            podman-compose build --no-cache

            # Stop old if symlink exists
            if [ -L "$CURRENT" ]; then
              OLD_RELEASE=$(readlink -f "$CURRENT")
              if [ -f "$OLD_RELEASE/docker-compose.yml" ]; then
                cd "$OLD_RELEASE"
                podman-compose down 2>&1 || true
              fi
            fi

            # Swap symlink and start new
            ln -sfn "$RELEASE" "$CURRENT"
            cd "$RELEASE"
            podman-compose up -d

            # === Health checks ===
            echo ""
            echo "=== Health checks ==="
            FAILED=0

            # Check pcalhaurin.es (retry up to 5 times)
            for i in 1 2 3 4 5; do
              CODE=$(curl -k -sS -o /dev/null -w '%{http_code}' --resolve "pcalhaurin.es:443:127.0.0.1" "https://pcalhaurin.es/" 2>/dev/null || echo "000")
              if [ "$CODE" = "200" ]; then
                echo "✅ pcalhaurin.es → $CODE"
                break
              fi
              echo "⏳ pcalhaurin.es → $CODE (attempt $i/5)"
              sleep 3
            done
            if [ "$CODE" != "200" ]; then
              echo "❌ pcalhaurin.es FAILED (last code: $CODE)"
              FAILED=1
            fi

            # Cross-check: acamaster.es should still be responding
            CODE=$(curl -k -sS -o /dev/null -w '%{http_code}' --resolve "acamaster.es:443:127.0.0.1" "https://acamaster.es/" 2>/dev/null || echo "000")
            if [ "$CODE" = "200" ]; then
              echo "✅ acamaster.es → $CODE (cross-check)"
            else
              echo "⚠️  acamaster.es → $CODE (cross-check — not our fault but flagging)"
            fi

            echo ""
            if [ "$FAILED" -ne 0 ]; then
              echo "❌ DEPLOY FAILED — health checks did not pass"
              exit 1
            fi
            echo "✅ Deploy successful"

            # Cleanup old releases (keep last 3)
            ls -dt $BASE/releases/*/ 2>/dev/null | tail -n +4 | xargs rm -rf 2>/dev/null || true
