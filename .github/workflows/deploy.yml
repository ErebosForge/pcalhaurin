name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DOMAIN: pcalhaurin.es
  DEPLOY_PATH: /var/www/pcalhaurin
  HUGO_VERSION: '0.165.0'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Hugo
        run: |
          wget -q "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar -xzf "hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          sudo mv hugo /usr/local/bin/

      - name: Build site
        working-directory: site
        run: hugo --minify

      - name: Deploy to server
        uses: easingthemes/ssh-deploy@v5
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.SERVER_HOST }}
          REMOTE_USER: ${{ secrets.SERVER_USER }}
          SOURCE: "site/public/"
          TARGET: "${{ env.DEPLOY_PATH }}/"
          ARGS: "-avz --delete"

      - name: Verify deployment
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "--- Deployment verification ---"
            ls -la ${{ env.DEPLOY_PATH }}/index.html
            echo "Files deployed: $(find ${{ env.DEPLOY_PATH }} -type f | wc -l)"
            echo "Total size: $(du -sh ${{ env.DEPLOY_PATH }} | cut -f1)"
