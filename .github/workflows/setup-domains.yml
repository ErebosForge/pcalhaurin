name: Setup Domains

on:
  workflow_dispatch:

env:
  DOMAIN: pcalhaurin.es
  TUNNEL_ID: 8ca19892-7ea7-42c5-a8a6-c2e90b056fe4

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Setup pcalhaurin.es DNS and settings
        run: |
          ZONE_ID=$(curl -s "https://api.cloudflare.com/client/v4/zones?name=${{ env.DOMAIN }}" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" | jq -r '.result[0].id')

          if [ "$ZONE_ID" = "null" ] || [ -z "$ZONE_ID" ]; then
            echo "ERROR: Could not resolve Zone ID for ${{ env.DOMAIN }}"
            exit 1
          fi
          echo "Zone ID: $ZONE_ID"

          # Create CNAMEs
          for NAME in "@" "www"; do
            RESULT=$(curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records" \
              -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
              -H "Content-Type: application/json" \
              --data "{
                \"type\": \"CNAME\",
                \"name\": \"${NAME}\",
                \"content\": \"${{ env.TUNNEL_ID }}.cfargotunnel.com\",
                \"proxied\": true
              }")
            SUCCESS=$(echo "$RESULT" | jq -r '.success')
            if [ "$SUCCESS" = "true" ]; then
              echo "✓ CNAME ${NAME} created"
            else
              ERROR=$(echo "$RESULT" | jq -r '.errors[0].message // "unknown"')
              echo "- CNAME ${NAME}: $ERROR"
            fi
          done

          # Enable Always Use HTTPS
          RESULT=$(curl -s -X PATCH "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/settings/always_use_https" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"value":"on"}')
          if [ "$(echo "$RESULT" | jq -r '.success')" = "true" ]; then
            echo "✓ Always Use HTTPS enabled"
          fi

          # Set SSL mode to Full
          RESULT=$(curl -s -X PATCH "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/settings/ssl" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"value":"full"}')
          if [ "$(echo "$RESULT" | jq -r '.success')" = "true" ]; then
            echo "✓ SSL mode set to Full"
          fi

          # Enable Brotli
          RESULT=$(curl -s -X PATCH "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/settings/brotli" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"value":"on"}')
          if [ "$(echo "$RESULT" | jq -r '.success')" = "true" ]; then
            echo "✓ Brotli enabled"
          fi

          echo ""
          echo "=== ${{ env.DOMAIN }} setup complete ==="
